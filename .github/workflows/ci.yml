name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:  # allow manual trigger with mode selection
    inputs:
      mode:
        description: 'Test mode: fast (push) or full (all tests)'
        required: true
        default: 'fast'
        type: choice
        options:
          - fast
          - full

jobs:
  test-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Create logs directory
        run: New-Item -ItemType Directory -Path logs -Force
        shell: pwsh

      - name: Install dependencies
        run: |
          npm install --ignore-scripts 2>&1 | Tee-Object -FilePath logs/install.log
        shell: pwsh

      - name: Build
        run: npx tsc -p tsconfig.json 2>&1 | Tee-Object -FilePath logs/build.log
        shell: pwsh

      - name: Tool validation
        run: npx tsx scripts/validate-tools.ts 2>&1 | Tee-Object -FilePath logs/validate.log
        shell: pwsh

      - name: Doctor
        run: npx tsx scripts/doctor.ts 2>&1 | Tee-Object -FilePath logs/doctor.log
        shell: pwsh
        continue-on-error: true

      - name: Standalone test
        run: npx tsx tests/test-extension.ts 2>&1 | Tee-Object -FilePath logs/standalone.log
        shell: pwsh

      - name: Windows native smoke test
        run: npx tsx tests/windows-native-smoke.ts 2>&1 | Tee-Object -FilePath logs/windows-smoke.log
        shell: pwsh

      # Fast mode (push): only smoke + live-workflow
      # Full mode (workflow_dispatch/tag): also phase2 + crash
      - name: Live workflow test
        run: npx tsx tests/live-workflow.ts 2>&1 | Tee-Object -FilePath logs/live-workflow.log
        shell: pwsh

      - name: Phase 2 hardening test (full mode only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'full' || github.event_name == 'push' && false }}
        run: npx tsx tests/phase2-hardening.ts 2>&1 | Tee-Object -FilePath logs/phase2.log
        shell: pwsh

      - name: Crash recovery test (full mode only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'full' || github.event_name == 'push' && false }}
        run: npx tsx tests/crash-recovery.ts 2>&1 | Tee-Object -FilePath logs/crash.log
        shell: pwsh

      - name: Container smoke test (skip if no Docker)
        run: npx tsx tests/container-smoke.ts 2>&1 | Tee-Object -FilePath logs/container.log
        shell: pwsh
        continue-on-error: true

      - name: Upload test logs as artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-logs-windows-${{ github.event_name }}
          path: logs/*.log

  test-ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Create logs directory
        run: mkdir -p logs

      - name: Install dependencies
        run: |
          npm install --ignore-scripts 2>&1 | tee logs/install.log

      - name: Build
        run: npx tsc -p tsconfig.json 2>&1 | tee logs/build.log

      - name: Tool validation
        run: npx tsx scripts/validate-tools.ts 2>&1 | tee logs/validate.log

      - name: Doctor
        run: npx tsx scripts/doctor.ts 2>&1 | tee logs/doctor.log
        continue-on-error: true

      - name: Standalone test
        run: timeout 60 npx tsx tests/test-extension.ts 2>&1 | tee logs/standalone.log
        continue-on-error: true

      - name: Container smoke test (skip if no Docker)
        run: npx tsx tests/container-smoke.ts 2>&1 | tee logs/container.log
        continue-on-error: true

      - name: Upload test logs as artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-logs-ubuntu-${{ github.event_name }}
          path: logs/*.log
